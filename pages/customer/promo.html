<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#f4f7fb">

    <title>Promo | Trips Wonder</title>

    <link rel="stylesheet" href="../../assets/css/shared/variables.css">
    <link rel="stylesheet" href="../../assets/css/shared/global.css">
    <link rel="stylesheet" href="../../assets/css/customer/promo.css">
    <link rel="stylesheet" href="../../assets/css/customer/customer-nav.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div id="customerBottomNav"></div>

<div class="promo-page">
    <header class="promo-header">
        <div>
            <h1>Promo</h1>
            <p>Exclusive deals for your next Trips Wonder adventure.</p>
        </div>

        <div class="promo-header-icon" aria-hidden="true">
            <i class="fa-solid fa-tags"></i>
        </div>
    </header>

    <main class="promo-content">
        <section class="promo-loading" id="promoLoading">
            <div class="promo-spinner"></div>
            <span>Loading available promos...</span>
        </section>

        <section class="promo-empty" id="promoEmpty" hidden>
            <div class="promo-empty-icon">
                <i class="fa-solid fa-ticket"></i>
            </div>
            <h2>No Active Promo</h2>
            <p>New travel deals and promo codes will appear here.</p>
        </section>

        <section class="promo-list" id="promoList" hidden></section>
    </main>
</div>

<div class="copy-toast" id="copyToast" role="status" aria-live="polite">
    Promo code copied
</div>

<script type="module" src="../../assets/js/customer/promo.js"></script>
<script type="module" src="../../assets/js/customer/customer-nav.js"></script>

</body>
</html>
