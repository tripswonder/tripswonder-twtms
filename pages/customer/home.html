<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TWTMS Customer Home</title>

<!-- ==========================================================
     GLOBAL CSS
========================================================== -->

<link rel="stylesheet" href="../../assets/css/variables.css">

<link rel="stylesheet" href="../../assets/css/global.css">

<link rel="stylesheet" href="../../assets/css/customer/home.css">

<link rel="stylesheet" href="../../assets/css/customer/customer-nav.css">


<!-- ==========================================================
     GOOGLE FONT
========================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.googleapis.com"
      crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">


<!-- ==========================================================
     FONT AWESOME
     Used for search + filter
========================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- ==========================================================
     HEADER
========================================================== -->

<header class="home-header">

    <button
        class="menu-btn"
        type="button"
        aria-label="Open menu">

        ☰

    </button>


    <img
        src="../../assets/images/logo.png"
        alt="Trips Wonder"
        class="header-logo"
    >


    <button
        class="notification-btn"
        type="button"
        aria-label="Notifications">

        🔔

        <span class="notification-badge">

            2

        </span>

    </button>

</header>



<!-- ==========================================================
     GREETING
========================================================== -->

<section class="greeting">

    <h1>

        Hi,
        <span id="customerName">
            Eric
        </span>!
        👋

    </h1>


    <p>

        Where will your next adventure take you?

    </p>

</section>



<!-- ==========================================================
     SEARCH
========================================================== -->

<section class="search-section">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>


        <input
            id="searchInput"
            type="text"
            placeholder="Search destination, tour code or keyword..."
        >


        <button
            class="filter-btn"
            type="button"
            aria-label="Filter tours">

            <i class="fa-solid fa-sliders"></i>

        </button>

    </div>

</section>



<div class="home">

</div>



<!-- ==========================================================
     UPCOMING TRIP
========================================================== -->

<section
    class="upcoming-trip"
    id="upcomingTripSection">


    <!-- ======================================================
         DYNAMIC BOOKING CARD
    ======================================================= -->

    <article
        class="trip-card"
        id="upcomingTripCard">


        <div class="trip-card-background">

        </div>


        <div class="trip-card-content">


            <!-- TRIP IMAGE -->

            <div class="trip-card-image">

                <img
                    id="upcomingTripImage"
                    src="../../assets/images/logo.png"
                    alt="Upcoming Trip">

            </div>



            <!-- TRIP INFORMATION -->

            <div class="trip-card-info">


                <span
                    id="upcomingTripCategory"
                    class="trip-category">

                    Tour

                </span>


                <h2 id="upcomingTripName">

                    Upcoming Trip

                </h2>


                <p id="upcomingTripLocation">

                    No upcoming booking yet.

                </p>


                <p
                    id="upcomingTripSchedule"
                    class="trip-schedule">

                    Explore our tours and book your next adventure.

                </p>


                <div class="trip-card-price">

                    <span>

                        From

                    </span>


                    <strong id="upcomingTripPrice">

                        —

                    </strong>

                </div>

            </div>



            <!-- MY TRIP BUTTON -->

            <button
                type="button"
                id="upcomingTripButton"
                class="trip-button">

                My Trip →

            </button>

        </div>

    </article>



    <!-- ======================================================
         NO UPCOMING BOOKING STATE
    ======================================================= -->

    <div
        class="no-upcoming-trip"
        id="noUpcomingTrip"
        hidden>


        <div class="no-trip-icon">

            🧳

        </div>


        <div>

            <h3>

                Ready for your next adventure?

            </h3>


            <p>

                You don't have an upcoming trip yet.

            </p>

        </div>


        <button
            type="button"
            id="exploreTripButton">

            Explore Tours →

        </button>

    </div>

</section>



<!-- ==========================================================
     EXPLORE OUR TOURS
========================================================== -->

<section class="explore-tours">

    <div
        class="explore-wrapper"
        id="exploreTours">

        <!--
            Tour packages will be loaded automatically
            by home.js
        -->

    </div>

</section>



<!-- ==========================================================
     SHARED CUSTOMER BOTTOM NAVIGATION
========================================================== -->

<div id="customerBottomNav"></div>

<!-- ==========================================================
     DATA
========================================================== -->

<script
    src="../../assets/data/package.js">
</script>



<!-- ==========================================================
     CUSTOMER HOME JAVASCRIPT
========================================================== -->

<script
    type="module"
    src="../../assets/js/customer/home.js">
</script>

<!-- ==========================================================
     SHARED CUSTOMER NAVIGATION
========================================================== -->

<script
    type="module"
    src="../../assets/js/customer/customer-nav.js">
</script>


</body>

</html>
