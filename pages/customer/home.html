<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TWTMS Customer Home</title>

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/global.css">
<link rel="stylesheet" href="../../assets/css/customer/home.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- ==========================================================
    HEADER
========================================================== -->
<header class="home-header">

    <button class="menu-btn">

        ☰

    </button>

    <img
        src="../../assets/images/logo.png"
        alt="Trips Wonder"
        class="header-logo"
    >

    <button class="notification-btn">

        🔔

        <span class="notification-badge">

            2

        </span>

    </button>

</header>

<!-- ==========================================================
     GREETING
========================================================== -->

<section class="greeting">

   <h1>

    Hi, <span id="customerName">Eric</span>! 👋

   </h1>

    <p>

        Where will your next adventure take you?

    </p>

</section>

<section class="search-section">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

           <input
            id="searchInput"
            type="text"
            placeholder="Search destination, tour code or keyword..."
        >

        <button class="filter-btn">

            <i class="fa-solid fa-sliders"></i>

        </button>

    </div>

</section>
    
<body>

<div class="home">

</div>

<!-- ==========================================================
     UPCOMING TRIP
========================================================== -->

<section class="upcoming-trip">

    <article class="trip-card">

        <div class="trip-image">

            <img
                src="../../assets/images/jomalig.jpeg"
                alt="Jomalig Island">

        </div>

        <div class="trip-content">

            <span class="trip-status">

                Confirmed

            </span>

            <h2 class="trip-title">

                Jomalig Island

            </h2>

            <p class="trip-date">

                September 5 – 7, 2026

            </p>

            <div class="trip-stats">

                <div class="stat-box">

                    <strong>45</strong>

                    <small>Days</small>

                </div>

                <div class="stat-box">

                    <strong>2</strong>

                    <small>Pax</small>

                </div>

                <div class="stat-box">

                    <strong>75%</strong>

                    <small>Paid</small>

                </div>

            </div>

            <button class="trip-button">

                My Trip

            </button>

        </div>

    </article>

</section>
    
<!-- ==========================================================
     FEATURE TOUR
========================================================== -->
   <section class="featured-tours">

    <div class="section-header">

        <h2>Featured Tours</h2>

        <a href="#">View All</a>

    </div>

    <div class="featured-slider">

        <article class="tour-card">

            <img
                src="../../assets/images/jomalig.jpeg"
                alt="Jomalig Island">

            <div class="tour-info">

                <h3>Jomalig Island</h3>

                <p>3 Days • 2 Nights</p>

                <strong>₱4,699</strong>

            </div>

        </article>

        <article class="tour-card">

            <img
                src="../../assets/images/calaguas.jpeg"
                alt="Calaguas">

            <div class="tour-info">

                <h3>Calaguas Island</h3>

                <p>3 Days • 2 Nights</p>

                <strong>₱4,999</strong>

            </div>

        </article>

        <article class="tour-card">

            <img
                src="../../assets/images/baguio.jpeg"
                alt="Baguio">

            <div class="tour-info">

                <h3>Baguio Tour</h3>

                <p>2 Days • 1 Night</p>

                <strong>₱2,799</strong>

            </div>

        </article>

    </div>

</section>
    
<!-- ==========================================================
     PROMO BANNER
========================================================== -->
    <section class="promo-banner"></section>
<!-- ==========================================================
     POPULAR DESTINATION
========================================================== -->
    <section class="popular-destination"></section>
<!-- ==========================================================
     BOOK AGAIN
========================================================== -->
    <section class="book-again"></section>

</main>

<nav class="bottom-nav"></nav>
<script type="module" src="../../assets/js/customer/home.js"></script>

</body>

</html>
