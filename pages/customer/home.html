<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TWTMS Customer Home</title>

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/global.css">
<link rel="stylesheet" href="../../assets/css/customer/home.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- ==========================================================
    HEADER
========================================================== -->
<header class="home-header">

    <button class="menu-btn">

        ☰

    </button>

    <img
        src="../../assets/images/logo.png"
        alt="Trips Wonder"
        class="header-logo"
    >

    <button class="notification-btn">

        🔔

        <span class="notification-badge">

            2

        </span>

    </button>

</header>

<!-- ==========================================================
     GREETING
========================================================== -->

<section class="greeting">

    <h1>

        Hi, Eric! 👋

    </h1>

    <p>

        Where will your next adventure take you?

    </p>

</section>

<section class="search-section">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            placeholder="Search destination, tour code or keyword..."
        >

        <button class="filter-btn">

            <i class="fa-solid fa-sliders"></i>

        </button>

    </div>

</section>
    
<body>

<div class="home">

</div>

<section class="upcoming-trip">

    <div class="trip-image">

        <span class="trip-badge">

            UPCOMING TRIP

        </span>

        <img src="../../assets/images/jomalig.jpeg" alt="Jomalig">

    </div>

    <div class="trip-details">

        <span class="status confirmed">

            CONFIRMED

        </span>

        <h2>

            Jomalig Island 🌴

        </h2>

        <p>

            3D2N • Island Getaway

        </p>

        <div class="trip-info">

            <span>📅 Sep 5 - 7, 2026</span>

            <span>📍 Real, Quezon</span>

        </div>

        <div class="trip-counter">

            <div>

                <strong>45</strong>

                <small>DAYS</small>

            </div>

            <div>

                <strong>2</strong>

                <small>PAX</small>

            </div>

            <div>

                <strong>75%</strong>

                <small>PAID</small>

            </div>

        </div>

        <button class="trip-button">

            Open Dashboard →

        </button>

    </div>

</section>

<script type="module" src="../../assets/js/customer/home.js"></script>

</body>

</html>
