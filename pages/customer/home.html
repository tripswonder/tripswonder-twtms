<html lang="en">

content="width=device-width, initial-scale=1.0">

 <title>TWTMS Customer Home</title>

<link rel="stylesheet" href="../../assets/css/global.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"

<body>

<!-- ==========================================================
    HEADER
========================================================== -->
<header class="home-header">

    <button class="menu-btn">

        ☰

    </button>

    <img
        src="../../assets/images/logo.png"
        alt="Trips Wonder"
        class="header-logo"
    >

    <button class="notification-btn">

        🔔

        <span class="notification-badge">

            2

        </span>

    </button>

</header>

<!-- ==========================================================
     GREETING
========================================================== -->

<section class="greeting">

   <h1>

    Hi, <span id="customerName">Eric</span>! 👋

   </h1>

    <p>

        Where will your next adventure take you?

    </p>

</section>

<section class="search-section">

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

           <input
            id="searchInput"
            type="text"
            placeholder="Search destination, tour code or keyword..."
        >

        <button class="filter-btn">

            <i class="fa-solid fa-sliders"></i>

        </button>

    </div>

</section>
    
<body>

<div class="home">

</div>

<!-- ==========================================================
     UPCOMING TRIP
========================================================== -->

<section class="upcoming-trip">

    <article class="trip-card">

        <img
            src="../../assets/images/jomalig.jpeg"
            alt="Jomalig Island"    
            class="trip-image">

                            <div class="trip-overlay">

                    <div class="trip-top">

                        <span class="trip-badge">📅 Upcoming Trip</span>

                        <h2 class="trip-title">JOMALIG ISLAND</h2>

                        <p class="trip-date">Sep 5 – 7, 2026 • 3D2N</p>

                        <span class="trip-status">✔ Confirmed</span>

                    </div>

                    <div class="trip-bottom">

                    <div class="trip-stats">

                        <div class="trip-stat">

                            <strong>45</strong>
                            <small>Days</small>

                        </div>

                        <div class="trip-stat">

                            <strong>2</strong>
                            <small>Pax</small>

                        </div>

                        <div class="trip-stat">

                            <strong>75%</strong>
                            <small>Paid</small>

                        </div>

                    </div>

                    <button class="trip-button">

                        My Trip →

                    </button>

                </div>
                </div>

    </article>

</section>
    
<!-- ==========================================================
     PROMO BANNER
========================================================== -->

<section class="promo-banner">

    <img
        src="../../assets/images/promo-banner.png"
        alt="Trips Wonder Travel Promo">

</section>

<!-- ==========================================================
     EXPLORE OUR TOURS
========================================================== -->

<section class="explore-tours">

    <div class="section-header">

        <h2 class="section-title">
            Explore Our Tours
        </h2>

    </div>

    <div class="explore-wrapper" id="exploreTours">

        <!-- Tour packages will be loaded automatically -->

    </div>

</section>
</main>

<nav class="bottom-nav">

    <a href="home.html" class="bottom-nav-item active">
        <span class="bottom-icon">🏠</span>
        <span class="bottom-label">Home</span>
    </a>

    <a href="my-trip.html" class="bottom-nav-item">
        <span class="bottom-icon">🧳</span>
        <span class="bottom-label">My Trip</span>
    </a>

    <a href="#" class="bottom-nav-item">
        <span class="bottom-icon">💬</span>
        <span class="bottom-label">Message</span>
    </a>

    <a href="#" class="bottom-nav-item notification-item">
        <span class="bottom-icon">
            🔔
            <span class="notification-badge">7</span>
        </span>
        <span class="bottom-label">Notification</span>
    </a>

    <a href="profile.html" class="bottom-nav-item">
        <span class="bottom-icon">👤</span>
        <span class="bottom-label">Profile</span>
    </a>

</nav>
