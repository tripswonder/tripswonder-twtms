<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#f5f8fc">
    <title>Message | Trips Wonder</title>

    <link rel="stylesheet" href="../../assets/css/shared/variables.css">
    <link rel="stylesheet" href="../../assets/css/shared/global.css">
    <link rel="stylesheet" href="../../assets/css/customer/message.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
<div class="mobile-shell message-shell">

    <main class="customer-message-page">
        <header class="customer-message-header">
            <div class="support-avatar">
                <img src="../../assets/images/logo.png" alt="Trips Wonder">
            </div>

            <div>
                <h1>Trips Wonder Support</h1>
                <p><span class="online-dot"></span> We’re here to help</p>
            </div>
        </header>

        <div class="customer-message-stream" id="customerMessageStream">
            <div class="message-loading">
                <i class="fa-regular fa-comments"></i>
                <span>Loading messages...</span>
            </div>
        </div>

        <form class="customer-message-composer" id="customerMessageForm">
            <textarea
                id="customerMessageInput"
                rows="1"
                maxlength="2000"
                placeholder="Type your message..."
                required></textarea>

            <button type="submit" id="customerSendButton" aria-label="Send message">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </main>

    <!-- SHARED CUSTOMER BOTTOM NAVIGATION -->
    <div
        id="customerBottomNav"
        class="customer-bottom-nav-slot">
    </div>
</div>

<script type="module" src="../../assets/js/customer/message.js"></script>
<script type="module" src="../../assets/js/customer/customer-nav.js"></script>
</body>
</html>
