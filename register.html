<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================================
         META
    =========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Create your customer account for Trips Wonder Travel and Tours.">

    <title>Create Account | Trips Wonder Travel and Tours</title>

    <!-- ==========================================================
         FAVICON
    =========================================================== -->

    <link
        rel="icon"
        type="image/jpeg"
        href="favicon.jpg">

    <!-- ==========================================================
         GOOGLE FONT
    =========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- ==========================================================
         FONT AWESOME
    =========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================================
         CSS FILES
    =========================================================== -->

    <link
        rel="stylesheet"
        href="assets/css/global.css">

    <link
        rel="stylesheet"
        href="assets/css/variables.css">

    <link
        rel="stylesheet"
        href="assets/css/register.css">

</head>

<body>    
  
  <!-- ==========================================================
         MAIN
    =========================================================== -->

    <main class="register-page">

        <!-- ==========================================================
             REGISTER CONTAINER
        =========================================================== -->

        <section class="register-container">

            <!-- ==========================================================
                 REGISTER CARD
            =========================================================== -->

            <div class="register-card">

                <!-- ==========================================================
                     LOGO
                =========================================================== -->

                <div class="register-logo">

                    <img
                        src="assets/images/logo.png"
                        alt="Trips Wonder Travel and Tours Logo">

                </div>

                <!-- ==========================================================
                     HEADER
                =========================================================== -->

                <div class="register-header">

                    <h1>Create Account</h1>

                    <p>

                        Create your customer account to start booking
                        your next adventure with
                        <strong>Trips Wonder Travel and Tours.</strong>

                    </p>

                </div>

              <!-- ==========================================================
     REGISTER FORM
========================================================== -->

<form id="registerForm">

    <!-- ==========================================================
         ACCOUNT INFORMATION
    =========================================================== -->

    <div class="form-section">

        <h2>Account Information</h2>

        <div class="input-group">

            <label for="username">

                Username <span>*</span>

            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>

        </div>

        <div class="input-group">

            <label for="email">

                Email Address <span>*</span>

            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required>

        </div>

        <div class="input-group">

            <label for="password">

                Password <span>*</span>

            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create your password"
                required>

        </div>

        <div class="input-group">

            <label for="confirmPassword">

                Confirm Password <span>*</span>

            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                required>

        </div>

    </div>

    <!-- ==========================================================
         PERSONAL INFORMATION
    =========================================================== -->

    <div class="form-section">

        <h2>Personal Information</h2>

        <div class="row">

            <div class="input-group">

                <label for="firstName">

                    First Name <span>*</span>

                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    required>

            </div>

            <div class="input-group">

                <label for="middleName">

                    Middle Name

                </label>

                <input
                    type="text"
                    id="middleName"
                    name="middleName">

            </div>

        </div>

        <div class="row">

            <div class="input-group">

                <label for="lastName">

                    Last Name <span>*</span>

                </label>

                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    required>

            </div>

            <div class="input-group">

                <label for="suffix">

                    Suffix

                </label>

                <input
                    type="text"
                    id="suffix"
                    name="suffix"
                    placeholder="Jr., Sr., III">

            </div>

        </div>

        <div class="input-group">

            <label for="contactNumber">

                Contact Number <span>*</span>

            </label>

            <input
                type="tel"
                id="contactNumber"
                name="contactNumber"
                placeholder="09XXXXXXXXX"
                required>

        </div>

        <div class="row">

            <div class="input-group">

                <label for="birthDate">

                    Birth Date

                </label>

                <input
                    type="date"
                    id="birthDate"
                    name="birthDate">

            </div>

            <div class="input-group">

                <label for="gender">

                    Gender

                </label>

                <select
                    id="gender"
                    name="gender">

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Prefer not to say">
                        Prefer not to say
                    </option>

                </select>

            </div>

        </div>

        <div class="input-group">

            <label for="address">

                Complete Address

            </label>

            <textarea
                id="address"
                name="address"
                rows="3"
                placeholder="Enter your complete address"></textarea>

        </div>

    </div>
        <!-- ==========================================================
         AGREEMENT
    =========================================================== -->

    <div class="agreement">

        <label>

            <input
                type="checkbox"
                id="terms"
                required>

            I agree to the
            <a href="#">Terms &amp; Conditions</a>

        </label>

        <label>

            <input
                type="checkbox"
                id="privacy"
                required>

            I agree to the
            <a href="#">Privacy Policy</a>

        </label>

    </div>

    <!-- ==========================================================
         BUTTON
    =========================================================== -->

    <button
        type="submit"
        class="register-btn">

        Create Account

    </button>

    <!-- ==========================================================
         LOGIN LINK
    =========================================================== -->

    <div class="login-link">

        <p>

            Already have an account?

            <a href="index.html">

                Sign In

            </a>

        </p>

    </div>

</form>

            </div>

        </section>

    </main>

    <!-- ==========================================================
         JAVASCRIPT
    =========================================================== -->

    <script type="module" src="assets/js/customer/register.js"></script>

</body>

</html>
