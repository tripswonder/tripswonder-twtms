<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TripsWonder Travel Management System">

    <title>
        TripsWonder Travel Management System
    </title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="assets/css/variables.css">

    <link
        rel="stylesheet"
        href="assets/css/global.css">

    <link
        rel="stylesheet"
        href="assets/css/login.css">

</head>

<body>

    <main class="login-page">

        <!-- LEFT SIDE -->

        <section class="login-left">

            <div class="left-overlay"></div>

            <div class="left-content">

                <img
                    src="assets/images/logo.png"
                    alt="TripsWonder Logo"
                    class="logo">

                <span class="system-badge">

                    Travel Management System

                </span>

                <h1>

                    Welcome Back!

                </h1>

                <p>

                    Manage bookings,
                    customers,
                    payments,
                    schedules
                    and reports
                    in one powerful platform.

                </p>

            </div>

        </section>

        <!-- RIGHT SIDE -->

        <section class="login-right">

            <div class="login-card">
             <img
            src="assets/images/logo.png"
            alt="TripsWonder Logo"
            class="mobile-logo">
                <div class="login-header">

                    <h2>

                        Sign In

                    </h2>

                    <p>

                        Login to continue to

                        <strong>

                            TWTMS

                        </strong>

                    </p>

                </div>

                <form id="loginForm">

                    <!-- USERNAME -->

                    <div class="input-group">

                        <label for="username">

                            Username

                        </label>

                        <div class="input-icon">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required>

                        </div>

                    </div>

                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">

                            Password

                        </label>

                        <div class="password-box">

                            <i class="fa-solid fa-lock input-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required> <!-- END OF PART 1 -->
                                                        <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show Password">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>

                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe">

                            <span>

                                Remember Me

                            </span>

                        </label>

                        <a
                            href="#"
                            class="forgot-password">

                            Forgot Password?

                        </a>

                    </div>

                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn">

                        <i class="fa-solid fa-right-to-bracket"></i>

                        <span>

                            Login

                        </span>

                    </button>

                </form>

                <!-- FOOTER -->

                <div class="login-footer">

                    <small>

                        © 2026 TripsWonder Management System

                    </small>

                </div>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->

    <script src="assets/js/login.js"></script>

</body>

</html>
